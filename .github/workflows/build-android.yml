name: Build APK

# 自用出包流水线：不依赖签名 secret，release 包回退到 debug 签名（可直接安装）
on:
  workflow_dispatch:
    inputs:
      split_per_abi:
        description: '按 ABI 分包（体积更小，装的时候选 arm64）'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    # ubuntu-latest 已内置 Android SDK / cmdline-tools，无需 android-actions/setup-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/29.0.14033849
          key: ${{ runner.os }}-ndk-29.0.14033849

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/ndk/29.0.14033849" ]; then
            echo "installing NDK 29.0.14033849..."
            yes | sdkmanager --install "ndk;29.0.14033849" || echo "NDK 预装失败，交给 AGP 自动下载"
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          if [ "${{ inputs.split_per_abi }}" = "false" ]; then
            flutter build apk --release
          else
            flutter build apk --release --split-per-abi
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*.apk dist/
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selene-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Attach to Release
    needs: android
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
